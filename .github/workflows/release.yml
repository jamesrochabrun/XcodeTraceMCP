name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:mcp-smoke
      - name: Pack packages
        run: |
          mkdir -p .release
          pnpm --dir packages/core pack --pack-destination "$PWD/.release"
          pnpm --dir packages/mcp-server pack --pack-destination "$PWD/.release"
      - name: Publish core
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if npm view "@xctrace-analyzer/core@$VERSION" version >/dev/null 2>&1; then
            echo "@xctrace-analyzer/core@$VERSION is already published"
          else
            npm publish ".release/xctrace-analyzer-core-$VERSION.tgz" --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish MCP server
        run: |
          VERSION="$(node -p "require('./packages/mcp-server/package.json').version")"
          if npm view "@xctrace-analyzer/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "@xctrace-analyzer/mcp-server@$VERSION is already published"
          else
            npm publish ".release/xctrace-analyzer-mcp-server-$VERSION.tgz" --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
